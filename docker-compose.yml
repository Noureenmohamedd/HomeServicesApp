version: "3.8"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: ds_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  user-db:
    image: mysql:8
    container_name: user_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: user_db
    ports:
      - "3307:3306"

  offer-db:
    image: mysql:8
    container_name: offer_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: offer_db
    ports:
      - "3308:3306"

  booking-db:
    image: mysql:8
    container_name: booking_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: booking_db
    ports:
      - "3309:3306"

  notification-db:
    image: mysql:8
    container_name: notification_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: notification_db
    ports:
      - "3310:3306"